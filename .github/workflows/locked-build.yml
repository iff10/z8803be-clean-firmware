name: Unlocked ZBT-Z8803BE Firm Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Clean System Build Environments
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
        sudo apt-get update
        sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
        sudo apt-get clean

    - name: Force Safe Absolute Code Fetching
      run: |
        git clone "https://github.com" --branch "openwrt-25.12" openwrt

    - name: Install Critical MediaTek Drivers
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject Unlocked Wireless Config and RNDIS Drivers
      run: |
        cd openwrt
        echo "CONFIG_TARGET_mediatek=y" > .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_zbtlink_zbt-z8803be=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-rndis=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-wdm=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-serial=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-serial-option=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-serial-wwan=y" >> .config
        make defconfig

    - name: Download Build Source Tree Packages
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Fresh Factory Firmwares
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Collect Recovery Binaries
      uses: actions/upload-artifact@v4
      with:
        name: Clean_ZBT_Z8803BE_Image
        path: openwrt/bin/targets/mediatek/filogic/*sysupgrade.bin
