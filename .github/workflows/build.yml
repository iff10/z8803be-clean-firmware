name: Build UK OpenWrt for ZBT-Z8803BE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git wget unzip python3 file
          mkdir -p openwrt

      - name: Download Image Builder
        run: |
          cd openwrt
          wget https://downloads.openwrt.org/snapshots/targets/mediatek/filogic/openwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.xz
          tar -xJf openwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.xz
          mv openwrt-imagebuilder-mediatek-filogic.Linux-x86_64 builder

      - name: Create Custom Files
        run: |
          cd openwrt/builder
          mkdir -p files/etc/config files/etc/uci-defaults files/usr/sbin/modules

          # Network
          cat > files/etc/config/network << 'EOF'
          config interface 'loopback'
                  option device 'lo'
                  option proto 'static'
                  option ipaddr '127.0.0.1'
                  option netmask '255.0.0.0'
          config globals 'globals'
                  option ula_prefix 'fd48:3c54:cb33::/48'
          config device
                  option name 'br-lan'
                  option type 'bridge'
                  list ports 'lan0'
                  list ports 'lan1'
                  list ports 'lan2'
                  list ports 'lan3'
          config interface 'lan'
                  option device 'br-lan'
                  option proto 'static'
                  option ipaddr '192.168.1.1'
                  option netmask '255.255.255.0'
                  option ip6assign '60'
          config device
                  option name 'br-wan'
                  option type 'bridge'
                  list ports 'eth1'
                  list ports 'eth2'
          config interface 'wan'
                  option device 'br-wan'
                  option proto 'dhcp'
                  option metric '10'
          config interface 'wan6'
                  option device 'br-wan'
                  option proto 'dhcpv6'
          config interface '4g'
                  option proto 'dhcp'
                  option metric '20'
                  option device 'usb0'
          EOF

          # Firewall
          cat > files/etc/config/firewall << 'EOF'
          config defaults
                  option syn_flood '1'
                  option input 'ACCEPT'
                  option output 'ACCEPT'
                  option forward 'REJECT'
          config zone
                  option name 'lan'
                  list network 'lan'
                  option input 'ACCEPT'
                  option output 'ACCEPT'
                  option forward 'ACCEPT'
          config zone
                  option name 'wan'
                  list network 'wan'
                  list network 'wan6'
                  list network '4g'
                  option input 'REJECT'
                  option output 'ACCEPT'
                  option forward 'REJECT'
                  option masq '1'
                  option mtu_fix '1'
          config forwarding
                  option src 'lan'
                  option dest 'wan'
          EOF

          # Modem init
          cat > files/usr/sbin/modules/quectel_rm500u << 'EOF'
          #!/bin/sh
          sleep 5
          if [ -e /dev/ttyUSB2 ]; then
              echo -e "AT+QCFG=\"usbnet\",5\r\n" > /dev/ttyUSB2
              echo -e "AT+CFUN=1,1\r\n" > /dev/ttyUSB2
          fi
          EOF
          chmod +x files/usr/sbin/modules/quectel_rm500u

          # UK bands
          cat > files/etc/uci-defaults/99-modem-tweaks << 'EOF'
          #!/bin/sh
          sleep 10
          if [ -e /dev/ttyUSB2 ]; then
              echo -e "AT+QNWPREFCFG=\"lte_band\",1:3:7:8:20\r\n" > /dev/ttyUSB2
              echo -e "AT+QNWPREFCFG=\"nr5g_band\",78\r\n" > /dev/ttyUSB2
              echo -e "AT+QNWPREFCFG=\"mode_pref\",NR5G\r\n" > /dev/ttyUSB2
              echo -e "AT+CFUN=1,1\r\n" > /dev/ttyUSB2
          fi
          rm -f /etc/uci-defaults/99-modem-tweaks
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-modem-tweaks

          # WiFi - UK country, no password
          cat > files/etc/config/wireless << 'EOF'
          config wifi-device 'radio0'
                  option type 'mac80211'
                  option path 'soc/11300000.pcie/pci0000:00/0000:00:00.0/0000:01:00.0'
                  option radio '0'
                  option band '2g'
                  option channel 'auto'
                  option htmode 'EHT20'
                  option country 'GB'
                  option cell_density '0'
                  option disabled '0'
          config wifi-iface 'default_radio0'
                  option device 'radio0'
                  option network 'lan'
                  option mode 'ap'
                  option ssid 'OpenWrt-2G'
                  option encryption 'none'
                  option disabled '0'
          EOF

      - name: Build Image
        run: |
          cd openwrt/builder
          make image PROFILE="zbtlink_zbt-z8803be" PACKAGES="luci luci-app-firewall kmod-usb-net-cdc-ncm kmod-usb-serial-option kmod-usb-net-rndis kmod-usb-serial usbutils comgt luci-proto-3g modemmanager luci-proto-modemmanager luci-app-atinout-mod luci-app-mmconfig luci-app-modeminfo" FILES="./files/"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-ZBT-Z8803BE-UK
          path: openwrt/builder/bin/targets/mediatek/filogic/*.bin
