name: Unlocked ZBT-Z8803BE Recovery Build

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com
  REPO_BRANCH: zbt8803be-openwrt-main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Safe Environment Setup
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # Clear out large unnecessary runtimes safely WITHOUT deleting apt configurations
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
        sudo apt-get update
        sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
        sudo apt-get clean

    - name: Clone Source Code
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    - name: Remove Hardcoded Region Locks
      run: |
        cd openwrt
        # Force wipe the custom uci-defaults that hardcode the PH country profiles
        rm -f package/base-files/files/etc/uci-defaults/*
        rm -f package/base-files/files/etc/rc.local
        
        # Create an entirely blank, clean local startup template
        echo -e '#!/bin/sh\nexit 0' > package/base-files/files/etc/rc.local
        chmod +x package/base-files/files/etc/rc.local

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Purge Bonding & Configure Unisoc Drivers
      run: |
        cd openwrt
        if [ -f ".buildenv/zbt8803be.config" ]; then cp .buildenv/zbt8803be.config .config; fi
        
        # Strip out the strict VRF and WAN-bonding systems causing your opkg blocks
        sed -i '/CONFIG_PACKAGE_kmod-bonding/d' .config
        sed -i '/CONFIG_PACKAGE_kmod-vrf/d' .config
        sed -i '/CONFIG_PACKAGE_luci-app-vrf/d' .config
        
        # Inject standard RNDIS, ECM, and NCM drivers so the locked module can connect immediately
        echo "CONFIG_PACKAGE_kmod-usb-net-rndis=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-wdm=y" >> .config
        
        make defconfig

    - name: Download package sources
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Unlocked Firmware
      run: |
        cd openwrt
        echo "Building with $(nproc) threads..."
        make -j$(nproc) || make -j1 V=s

    - name: Upload Clean Recovery Firmware
      uses: actions/upload-artifact@v4
      with:
        name: Clean_ZBT_Z8803BE_Image
        path: openwrt/bin/targets/mediatek/filogic/*sysupgrade.bin

