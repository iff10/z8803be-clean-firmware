name: Unlocked ZBT-Z8803BE Recovery Build

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com
  REPO_BRANCH: zbt8803be-openwrt-main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clean System Dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
        sudo apt-get update
        sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
        sudo apt-get clean

    - name: Clone Source Code
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    - name: Force Global Wi-Fi and Clean Profiles
      run: |
        cd openwrt
        # Wipe the broken hardcoded startup scripts that lock the country codes
        rm -rf package/base-files/files/etc/uci-defaults/*
        rm -rf package/base-files/files/etc/rc.local
        
        # Re-create a clean, empty local startup file
        echo -e '#!/bin/sh\nexit 0' > package/base-files/files/etc/rc.local
        chmod +x package/base-files/files/etc/rc.local

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Purge Broken Network Policies
      run: |
        cd openwrt
        if [ -f ".buildenv/zbt8803be.config" ]; then cp .buildenv/zbt8803be.config .config; fi
        
        # Remove the conflicting bonding and virtual routing loops that block operations
        sed -i '/CONFIG_PACKAGE_kmod-bonding/d' .config
        sed -i '/CONFIG_PACKAGE_kmod-vrf/d' .config
        sed -i '/CONFIG_PACKAGE_luci-app-vrf/d' .config
        
        # Inject standard RNDIS and ECM/NCM capabilities to safely match your module state
        echo "CONFIG_PACKAGE_kmod-usb-net-rndis=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-wdm=y" >> .config
        
        # Clean compile dependencies
        make defconfig

    - name: Download and Compile
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;
        make -j$(nproc) || make -j1 V=s

    - name: Upload Clean Recovery Firmware
      uses: actions/upload-artifact@v4
      with:
        name: Clean_ZBT_Z8803BE_Image
        path: openwrt/bin/targets/mediatek/filogic/*sysupgrade.bin
