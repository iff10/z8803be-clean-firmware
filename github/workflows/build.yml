name: Automated Z8803BE Compilation (with Quectel RM500U-EA support)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # Using the pttuan/openwrt source and pinned commit you provided
      OPENWRT_REPO: https://github.com/pttuan/openwrt.git
      OPENWRT_COMMIT: fce4731b5c3323ad3652643d64bf0f78e51293b0
      OPENWRT_DIR: openwrt-source
      CCACHE_DIR: ${{ runner.temp }}/ccache
      USE_CCACHE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install compiling dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses5-dev gawk git subversion libssl-dev \
            gettext unzip zlib1g-dev file python3-setuptools rsync ccache curl ca-certificates

      - name: Clone OpenWrt sources (pinned commit)
        run: |
          set -euxo pipefail
          rm -rf "${OPENWRT_DIR}"
          git clone "${OPENWRT_REPO}" "${OPENWRT_DIR}"
          cd "${OPENWRT_DIR}"
          # checkout the exact commit you provided
          git checkout ${OPENWRT_COMMIT}

      - name: Restore OpenWrt & ccache caches
        uses: actions/cache@v4
        with:
          path: |
            openwrt-source/dl
            openwrt-source/downloads
            openwrt-source/build_dir
            openwrt-source/staging_dir
            ${{ runner.temp }}/ccache
          key: ${{ runner.os }}-openwrt-${{ env.OPENWRT_COMMIT }}-${{ hashFiles('**/feeds.conf*') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-${{ env.OPENWRT_COMMIT }}-

      - name: Prepare feeds
        working-directory: openwrt-source
        run: |
          set -euxo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Purge Broken Vendor Watchdog
        working-directory: openwrt-source
        run: |
          set -euxo pipefail
          mkdir -p target/linux/mediatek/filogic/base-files/usr/sbin
          printf '%s\n' '#!/bin/sh' 'exit 0' > target/linux/mediatek/filogic/base-files/usr/sbin/watchdog.sh
          chmod +x target/linux/mediatek/filogic/base-files/usr/sbin/watchdog.sh

      - name: Inject Custom Three UK + Quectel RM500U-EA Configuration
        working-directory: openwrt-source
        run: |
          set -euxo pipefail
          # Base target and packages (including modem support for Quectel RM500U-EA)
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_zbtlink_zbt-z8803be=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_libqmi=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_comgt=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-proto-qmi=y
          CONFIG_PACKAGE_luci-proto-ncm=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_wget=y
          EOF
          make defconfig

      - name: Configure ccache
        run: |
          set -euxo pipefail
          mkdir -p "${CCACHE_DIR}"
          ccache -M 10G

      - name: Compile Custom Sysupgrade Image
        working-directory: openwrt-source
        run: |
          set -euxo pipefail
          # capture full log while streaming to the step log
          make -j$(nproc) V=s 2>&1 | tee "${GITHUB_WORKSPACE}/openwrt-build.log" || (cat "${GITHUB_WORKSPACE}/openwrt-build.log" && exit 1)

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-build-log
          path: openwrt-build.log
          retention-days: 7

      - name: Upload Finished Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z8803BE-Clean-ThreeUK-Firmware
          path: openwrt-source/bin/targets/mediatek/filogic/*sysupgrade.bin
          retention-days: 7
