name: Build UK OpenWrt (Z8803BE Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git wget unzip python3 file rsync libncurses5-dev zlib1g-dev gawk

      # Fixed: Using exact OpenWrt 24.10.1 naming syntax structure to resolve the 404 download error
      - name: Download OpenWrt Image Builder (24.10.1 Stable)
        run: |
          mkdir -p builder
          cd builder
          wget https://openwrt.org
          tar -xJf openwrt-imagebuilder-24.10.1-mediatek-filogic.Linux-x86_64.tar.xz
          mv openwrt-imagebuilder-24.10.1-mediatek-filogic.Linux-x86_64 imagebuilder

      - name: Create Custom Files
        run: |
          mkdir -p files/etc/config files/etc/uci-defaults

          cat > files/etc/config/network << 'EOF'
          config interface 'loopback'
                  option device 'lo'
                  option proto 'static'
                  option ipaddr '127.0.0.1'
                  option netmask '255.0.0.0'

          config globals 'globals'
                  option ula_prefix 'fd48:3c54:cb33::/48'

          config device
                  option name 'br-lan'
                  option type 'bridge'
                  list ports 'lan0'
                  list ports 'lan1'
                  list ports 'lan2'
                  list ports 'lan3'

          config interface 'lan'
                  option device 'br-lan'
                  option proto 'static'
                  option ipaddr '192.168.1.1'
                  option netmask '255.255.255.0'
                  option ip6assign '60'

          config device
                  option name 'br-wan'
                  option type 'bridge'
                  list ports 'eth1'
                  list ports 'eth2'

          config interface 'wan'
                  option device 'br-wan'
                  option proto 'dhcp'
                  option metric '10'

          config interface 'wan6'
                  option device 'br-wan'
                  option proto 'dhcpv6'

          config interface 'modem'
                  option proto 'modemmanager'
                  option device 'usb0'
                  option apn 'internet'
                  option auth 'none'
                  option metric '20'
          EOF

          cat > files/etc/config/firewall << 'EOF'
          config defaults
                  option syn_flood '1'
                  option input 'ACCEPT'
                  option output 'ACCEPT'
                  option forward 'REJECT'

          config zone
                  option name 'lan'
                  list network 'lan'
                  option input 'ACCEPT'
                  option output 'ACCEPT'
                  option forward 'ACCEPT'

          config zone
                  option name 'wan'
                  list network 'wan'
                  list network 'wan6'
                  list network 'modem'
                  option input 'REJECT'
                  option output 'ACCEPT'
                  option forward 'REJECT'
                  option masq '1'
                  option mtu_fix '1'

          config forwarding
                  option src 'lan'
                  option dest 'wan'
          EOF

          cat > files/etc/uci-defaults/99-modem-tweaks << 'EOF'
          #!/bin/sh
          (
              sleep 15
              if [ -e /dev/ttyUSB2 ]; then
                  printf "AT+QCFG=\"usbnet\",5\r\n" > /dev/ttyUSB2
                  sleep 2
                  printf "AT+QNWPREFCFG=\"lte_band\",1:3:7:8:20\r\n" > /dev/ttyUSB2
                  printf "AT+QNWPREFCFG=\"nr5g_band\",78\r\n" > /dev/ttyUSB2
                  printf "AT+QNWPREFCFG=\"mode_pref\",NR5G\r\n" > /dev/ttyUSB2
                  printf "AT+CFUN=1,1\r\n" > /dev/ttyUSB2
              fi
          ) &
          
          uci set wireless.globals.country='GB'
          uci commit wireless
          
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-modem-tweaks

      - name: Build Image
        run: |
          cp -r files builder/imagebuilder/
          cd builder/imagebuilder
          make PROFILE="zbtlink_zbt-z8803be" \
            PACKAGES="luci luci-app-firewall \
              kmod-usb-net-cdc-ncm kmod-usb-serial-option kmod-usb-net-rndis kmod-usb-serial \
              usbutils comgt modemmanager luci-proto-modemmanager" \
            FILES="./files/"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-ZBT-Z8803BE-UK
          path: builder/imagebuilder/bin/targets/mediatek/filogic/*.bin



