name: Build UK OpenWrt (0xFar5eer Source Base Fixed Drivers)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git wget unzip python3 file rsync libncurses5-dev zlib1g-dev gawk gettext libssl-dev xsltproc subversion

      - name: Clone 0xFar5eer Source
        uses: actions/checkout@v4
        with:
          repository: 0xFar5eer/openwrt25.12_ZBT_Z8803BE
          ref: zbt8803be-openwrt-main
          path: openwrt-source
          fetch-depth: 1

      - name: Update and Install Feeds
        run: |
          cd openwrt-source
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Custom Configurations & Scripts
        run: |
          cd openwrt-source
          mkdir -p files/etc/config files/etc/uci-defaults

          cat > files/etc/config/network << 'EOF'
          config interface 'loopback'
                  option device 'lo'
                  option proto 'static'
                  option ipaddr '127.0.0.1'
                  option netmask '255.0.0.0'

          config globals 'globals'
                  option ula_prefix 'fd48:3c54:cb33::/48'

          config device
                  option name 'br-lan'
                  option type 'bridge'
                  list ports 'lan0'
                  list ports 'lan1'
                  list ports 'lan2'
                  list ports 'lan3'

          config interface 'lan'
                  option device 'br-lan'
                  option proto 'static'
                  option ipaddr '192.168.1.1'
                  option netmask '255.255.255.0'
                  option ip6assign '60'

          config device
                  option name 'br-wan'
                  option type 'bridge'
                  list ports 'eth1'
                  list ports 'eth2'

          config interface 'wan'
                  option device 'br-wan'
                  option proto 'dhcp'
                  option metric '10'

          config interface 'wan6'
                  option device 'br-wan'
                  option proto 'dhcpv6'

          config interface 'modem'
                  option proto 'modemmanager'
                  option device 'usb0'
                  option apn 'internet'
                  option auth 'none'
                  option metric '20'
          EOF

          cat > files/etc/config/firewall << 'EOF'
          config defaults
                  option syn_flood '1'
                  option input 'ACCEPT'
                  option output 'ACCEPT'
                  option forward 'REJECT'

          config zone
                  option name 'lan'
                  list network 'lan'
                  option input 'ACCEPT'
                  option output 'ACCEPT'
                  option forward 'ACCEPT'

          config zone
                  option name 'wan'
                  list network 'wan'
                  list network 'wan6'
                  list network 'modem'
                  option input 'REJECT'
                  option output 'ACCEPT'
                  option forward 'REJECT'
                  option masq '1'
                  option mtu_fix '1'

          config forwarding
                  option src 'lan'
                  option dest 'wan'
          EOF

          # Fixed: Cleaned up script to handle Wi-Fi country code cleanly without breaking modem sequences
          cat > files/etc/uci-defaults/99-custom-tweaks << 'EOF'
          #!/bin/sh
          uci set wireless.globals.country='GB'
          uci commit wireless
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom-tweaks

      - name: Configure Target Defconfig
        run: |
          cd openwrt-source
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_zbtlink_zbt-z8803be=y" >> .config
          
          # Custom packages
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_modemmanager=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-modemmanager=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-serial-option=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-rndis=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-serial=y" >> .config
          echo "CONFIG_PACKAGE_usbutils=y" >> .config
          
          # FIXED: Critical missed driver package for the Quectel RM500U engine platform
          echo "CONFIG_PACKAGE_kmod-usb-net-rtl8152=y" >> .config
          
          make defconfig

      - name: Build Firmware Components
        run: |
          cd openwrt-source
          make -j$(nproc) V=s

      - name: Archive and Upload Firmware Images
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-ZBT-Z8803BE-UK-Fixed-Modem
          path: openwrt-source/bin/targets/mediatek/filogic/*.bin
